
<main>
  <div class="Profile">
    <h1>Student Management</h1>
    <a routerLink="/profile">Profile</a>
    <a routerLink="/TeacherCreate">Create Teacher</a>
    <a routerLink="/CreateSession">Create Session</a>
    <a routerLink="/Teams">Tea</a>

    <a routerLink="/TeacherCreate">Create Teacher</a>
    <a routerLink="/Teams">Create Team</a>
  </div>

  <div class="Form">
    <div class="name">
      <input
        type="text"
        placeholder="First name"
        [(ngModel)]="studentData.firstName"
      />

      <input
        type="text"
        placeholder="Last name"
        [(ngModel)]="studentData.lastName"
      />
    </div>

    <div class="name">
      <input
        type="email"
        placeholder="Email"
        [(ngModel)]="studentData.email"
      />

      <input
        type="password"
        placeholder="Password"
        [(ngModel)]="studentData.password"
      />
    </div>

    <button
      type="button"
      (click)="CreateStudent()"
      [disabled]="loading"
    >
      {{ loading ? 'Please wait...' : 'Create Student' }}
    </button>
  </div>

  <div class="data">
    @for (student of Students(); track student.id) {
      <div class="student">
        <span class="id">{{ student.id }}</span>

        <div class="info">
          <span class="full-name">
            {{ student.firstName }} {{ student.lastName }}
          </span>

          <span class="email">
            {{ student.email }}
          </span>
        </div>

        <button
          type="button"
          (click)="deleteStudent(student.id)"
        >
          Delete
        </button>
      </div>
    } @empty {
      <p>No students found.</p>
    }
  </div>
</main>
