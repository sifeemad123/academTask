<main>
  <div class="Profile">
    <h1>Student Management</h1>
    <a routerLink="/profile">Profile</a>
    <a routerLink="/TeacherCreate">Create Teacher</a>

  </div>
  <div class="Form">
    <div class="name">
      <input type="name" placeholder="First name" [(ngModel)]="studentData.firstName" />
      <input type="name" placeholder="last name" [(ngModel)]="studentData.lastName" />
    </div>
    <div class="authrization">
      <input type="email" placeholder="First email" [(ngModel)]="studentData.email" />
      <input type="password" placeholder="password" [(ngModel)]="studentData.password" />
    </div>

    <button (click)="CreateStudent()">create student</button>
  </div>

<div class="data">
  @for (student of Students; track student.id) {
    <div class="student">
      <span class="id">{{ student.id }}</span>
      <div class="info">
        <span class="full-name">{{ student.firstName }} {{ student.lastName }} ||   </span>
        <span class="email">{{ student.email }}</span>
      </div>
      <button (click)="deleteStudent(student.id)">delete</button>
    </div>
  }
</div>
</main>
