<main>
    <div class="Profile">
    <h1>Teacher Management</h1>
    <a routerLink="/StudentsComponent">Create Student</a>

  </div>
  <div class="Form">
    <div class="name">
      <input type="name" placeholder="First name" [(ngModel)]="teacherData.firstName" />
      <input type="name" placeholder="last name" [(ngModel)]="teacherData.lastName" />
      <input type="email" placeholder="Email" [(ngModel)]="teacherData.email" />
      <input type="phone" placeholder="Phone" [(ngModel)]="teacherData.phone" />
    </div>

    <button (click)="CreateTeacher()">create teacher</button>
  </div>
  


  <div class="data">
    @for (teacher of Teachers; track teacher.id) {
      <div class="teacher">
        <span class="id">{{ teacher.id }}</span>
        <div class="info">
          <span class="full-name">{{ teacher.firstName }} {{ teacher.lastName }}</span>
          <span class="email">{{ teacher.email }}</span>
          <span class="phone">{{ teacher.phone }}</span>
        </div>
        <button (click)="deleteTeacher(teacher.id)">delete</button>
      </div>
    }
  </div>
</main>
