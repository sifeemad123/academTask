
<main>
  <div class="Profile">
    <h1>Tasks mangment</h1>

    <a routerLink="/TeacherCreate">Create Teacher</a>
    <a routerLink="/StudentsComponent">Create Student</a>
  </div>

  <div class="Form">
    <div class="name">
      <input
        type="text"
        placeholder="First name"
        [(ngModel)]="teamData.name"
      />
    </div>

    <button type="button" (click)="CreateTeam()">
      Create Team
    </button>
  </div>

  <div class="data">
    @for (team of Teams; track team.id) {
      <div class="team">
        <span class="id">{{ team.id }}</span>

        <div class="info">
          <span class="full-name">
            {{ team.name }}
          </span>
        </div>
      </div>
    <button
      type="button"
      (click)="deleteTeam(teamData.id)"
    >
      Delete
    </button>
    }
  </div>
</main>
