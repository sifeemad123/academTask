<div class="login-container">
  <div class="login-card">

    <div class="login-header">
      <h2>Welcome Back!</h2>
      <p>Login to your account</p>
    </div>

    <div class="alert error-alert" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="alert success-alert" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()"
          novalidate>

      <div class="form-group">
        <label for="email">Email Address</label>

        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="Enter your email"
          autocomplete="email"
          [class.invalid]="f['email'].touched && f['email'].invalid"
        />

        <small class="error"
          *ngIf="f['email'].touched && f['email'].hasError('required')">
          Email is required.
        </small>

        <small class="error"
          *ngIf="f['email'].touched && f['email'].hasError('email')">
          Please enter a valid email address.
        </small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          [class.invalid]="f['password'].touched && f['password'].invalid"
        />

        <small class="error"
          *ngIf="f['password'].touched && f['password'].hasError('required')">
          Password is required.
        </small>

        <small class="error"
          *ngIf="f['password'].touched && f['password'].hasError('minlength')">
          Password must be at least 8 characters.
        </small>
      </div>

      <div class="form-options">
        <label class="remember">
          <input type="checkbox" formControlName="rememberMe" />
          Remember me
        </label>

        <a routerLink="/forgot-password">Forgot password?</a>
      </div>


      <button type="submit" [disabled]="loading">
         {{ loading ? 'Logging in...' : 'Login' }}
      </button>


      <p class="footer-text">
        Don't have an account?
        <a routerLink="/SignUp">Sign up</a>
      </p>

    </form>
  </div>
</div>
