
<main>
  <div class="Profile">
    <h1>Tasks Management</h1>

    <a routerLink="/TeacherCreate">Create Teacher</a>
    <a routerLink="/Teams">Create Team</a>
       <a routerLink="/StudentsComponent">Create Student</a>
  </div>

  <div class="Form">
    <div class="name">
      <input
        type="text"
        placeholder="name"
        [(ngModel)]="taskData.name"
      />

      <input
        type="text"
        placeholder="Descreption"
        [(ngModel)]="$any(taskData.task).TasksRequst.taskDescription"
      />
    </div>

    <div class="authorization">
      <input
        type="name"
        placeholder="Student"
        [(ngModel)]="$any(taskData.task).TasksRequst.students"
      />

      <input
        type="name"
        placeholder="Teacher"
        [(ngModel)]="$any(taskData.task).TasksRequst.teacher"
      />
      <input
        type="name"
        placeholder="task type"
        [(ngModel)]="$any(taskData.task).TasksRequst.taskType"
      />
    </div>

    <button
      type="button"
      (click)="CreateTasks()"
      [disabled]="loading"
    >
      {{ loading ? 'Please wait...' : 'Create Student' }}
    </button>
  </div>

  <div class="data">
    @for (Task of tasks; track Task.id) {
      <div class="student">
        <span class="id">{{ Task.id }}</span>

        <div class="info">
          <span class="full-name">
            {{ Task.name }} 
          </span>

          <span class="email">
            {{ Task.task }}
          </span>
        </div>

        <button
          type="button"
          (click)="deleteTasks(Task.id)"
        >
          Delete
        </button>
      </div>
    } @empty {
      <p>No Task found.</p>
    }
  </div>
</main>
